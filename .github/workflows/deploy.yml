name: autoBlog CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autoblog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -f backend/pom.xml verify
      - run: node --test analysis-runtime/chrome-bridge.test.mjs analysis-runtime/new-draft.test.mjs analysis-runtime/table-preservation.test.mjs analysis-runtime/category-selection.test.mjs
      - run: npm ci && npm run build
        working-directory: frontend
      - run: |
          mkdir artifact
          cp backend/target/issue-desk-0.1.0.jar artifact/app.jar
          cp deploy/Dockerfile deploy/release.sh artifact/
          tar -czf artifact/frontend.tar.gz -C frontend/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: autoblog
          path: artifact/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: autoblog
          path: artifact
      - name: Configure verified SSH connection
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy isolated service
        env:
          SERVER: ${{ secrets.LIGHTSAIL_HOST }}
          USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
        run: |
          scp -B artifact/* "$USERNAME@$SERVER:/home/ubuntu/autoblog/incoming/"
          ssh -o BatchMode=yes "$USERNAME@$SERVER" 'cd /home/ubuntu/autoblog && bash incoming/release.sh'
