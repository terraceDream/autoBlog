limit_req_zone $binary_remote_addr zone=autoblog_api:10m rate=10r/s;
server {
  listen 80;
  server_name 54.116.23.226;
  location /.well-known/acme-challenge/ { root /var/www/autoblog-acme; }
  location / { return 301 https://54.116.23.226$request_uri; }
}
server {
  listen 443 ssl default_server;
  server_name 54.116.23.226;
  ssl_certificate /etc/letsencrypt-autoblog/live/autoblog-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt-autoblog/live/autoblog-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  auth_basic "autoBlog private";
  auth_basic_user_file /etc/nginx/autoblog.htpasswd;
  root /var/www/autoblog/current;
  client_max_body_size 2m;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  location / { try_files $uri $uri/ /index.html; }
  # Only these POST endpoints bypass browser login; controller checks an independent random token.
  location ~ ^/api/tistory-browser/(claim|jobs/[a-f0-9-]+/result)$ {
    auth_basic off;
    limit_except POST { deny all; }
    limit_req zone=autoblog_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
  }
  location /api/ {
    limit_req zone=autoblog_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }
  location ~ /\. { deny all; }
}
