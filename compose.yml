services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: issuedesk
      POSTGRES_USER: issuedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - issuedesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuedesk -d issuedesk"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  issuedesk_pg:
